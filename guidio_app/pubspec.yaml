name: guidio_app
description: Guidio - AI Navigation Assistant untuk Tunanetra
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Kamera
  camera: ^0.11.0+2

  # TFLite on-device inference
  tflite_flutter: ^0.12.1

  # Text-to-Speech (Bahasa Indonesia)
  flutter_tts: ^4.2.5

  # Speech-to-Text (Voice Assistant)
  speech_to_text: ^7.0.0

  # WebSocket ke server
  # web_socket_channel DIHAPUS. Nol pemakaian di seluruh lib/ dan test/;
  # sisa dari era deteksi lewat `WS /ws/detect`, yang sudah dibuang sejak
  # deteksi rintangan dipindah on-device. Dependensi yang tidak dipakai tetap
  # ikut resolusi versi dan tetap harus diaudit saat rilis.

  # HTTP untuk REST (OCR, single-shot detect, narasi)
  http: ^1.2.1

  # Sensor accelerometer (camera health check posisi)
  sensors_plus: ^7.0.0

  # Kondisi global - offline, baterai kritis (StatusBanner gabungan)
  connectivity_plus: ^6.0.5
  battery_plus: ^6.0.2

  # Izin kamera, mikrofon
  permission_handler: ^11.3.1

  # Haptic feedback (getar saat mic aktif)
  vibration: ^2.0.0

  # Local storage untuk lokasi favorit (tanpa login)
  shared_preferences: ^2.3.2

  # Konversi YUV420 → JPEG untuk server stream
  image: ^4.1.7

  # Icon
  cupertino_icons: ^1.0.8

  # Font - IBM Plex Sans / IBM Plex Mono (design system Vinara)
  google_mlkit_text_recognition: ^0.16.0

  # Terjemahan Inggris → Indonesia ON-DEVICE untuk caption Moondream2.
  #
  # Moondream2 di backend hanya bisa berbahasa Inggris, dan mode Deskripsi
  # Suasana dulunya satu-satunya mode yang menjawab dalam bahasa yang tidak
  # dimengerti target penggunanya. ML Kit Translate menutup jarak itu tanpa
  # melanggar prinsip yang dipegang proyek ini: offline penuh sesudah model
  # terunduh, tidak lewat server, dan tidak mengarang seperti LLM.
  #
  # VERSI SENGAJA DIKUNCI DI 0.14.x, BUKAN 0.15.1 (rilis terbaru).
  # 0.15.x menuntut Dart SDK >= 3.12; toolchain proyek ini Dart 3.10.4
  # (Flutter 3.38.5), jadi `flutter pub get` akan gagal resolusi. 0.14.0
  # memakai google_mlkit_commons ^0.12.0 - persis versi yang sudah terkunci
  # oleh google_mlkit_text_recognition di atas, jadi tidak ada konflik.
  # Naikkan ke ^0.15.1 setelah Flutter/Dart proyek ikut naik.
  google_mlkit_translation: ^0.14.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  # Dipakai test/money_pipeline_test.dart untuk merakit CameraImage YUV420
  # palsu. `package:camera` mengekspor ImageFormatGroup tapi TIDAK mengekspor
  # CameraImageData/CameraImagePlane/CameraImageFormat, jadi paket ini harus
  # dirujuk langsung. Sudah ikut sebagai dependensi transitif camera; baris ini
  # membuatnya eksplisit supaya lint depend_on_referenced_packages tenang.
  camera_platform_interface: ^2.13.0
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/models/ssd_mobilenet.tflite        # TFLiteService - deteksi rintangan
    - assets/icons/app_splash_screen.png
    - assets/models/labelmap.txt                # TFLiteService - label COCO
    - assets/models/rupiah_classifier_int8.tflite  # MoneyTFLiteService - 7 pecahan
    #
    # uang_rupiah.tflite (2,7 MB) dan rupiah_classifier_fp16.tflite (4,6 MB)
    # TIDAK dibundel: MoneyTFLiteService hanya memuat varian int8, jadi 7,3 MB
    # itu ikut ke APK tanpa satu pun yang membacanya. Berkasnya tetap ada di
    # assets/models/ sebagai arsip.
    #
    # int8 yang dipilih, BUKAN fp16, sesuai rekomendasi repo training sendiri
    # (`scripts/02_export_tflite.py`, kunci `recommended_for_flutter`). Bobot
    # dan aktivasinya INT8 tapi I/O-nya tetap float32, jadi jalur praproses
    # di Dart tidak berubah sama sekali.
    #
    # CATATAN untuk `flutter test`: runtime desktop di blobs/ berasal dari
    # tflite_flutter_plugin v0.5.0 (2021) dan TIDAK bisa menjalankan model
    # terkuantisasi - keluarannya kolaps jadi rata 1/7 untuk masukan apa pun.
    # Android memakai LiteRT 1.4.0 lewat tflite_flutter 0.12.1 dan menjalankan
    # model ini dengan benar. Jangan simpulkan model rusak dari hasil desktop.
    #
    # rupiah_labels.txt juga tidak dibundel - urutan kelasnya sudah tetap di
    # MoneyTFLiteService.classValues, jadi tidak ada yang memuatnya lewat
    # rootBundle. Berkasnya disimpan sebagai rujukan saat mengganti model.
    - assets/models/pidnet_s_3zona.tflite       # PidnetService - segmentasi jalur
    #
    # pidnet_s_3zona_fp16.tflite TIDAK dibundel. Tensor masukannya bertipe
    # FLOAT16 sementara seluruh pipeline menghasilkan FLOAT32, jadi dia tidak
    # akan pernah bisa dipakai - delegate apa pun. Dulu dia dicoba lebih dulu
    # dan hanya dilewati kalau berkasnya hilang, sehingga segmentasi jalur
    # gagal di setiap frame tanpa satu pun tanda di layar.
    #
    # `PidnetService.tryLoad` sekarang membuktikan tiap varian dengan
    # inferensi percobaan, jadi menambahkannya kembali pun aman - tapi
    # 1,3 MB di APK untuk berkas yang pasti ditolak tetap sia-sia.
    - assets/models/yolo11n_navigasi.tflite     # YoloNavigasiService - rintangan navigasi, 6 kelas
    - assets/models/yolo11n.tflite              # YoloNavInt8Service - lapis keempat, INT8 NCHW
    #
    # yolo11n.tflite SEMPAT dicabut dari daftar ini, dan pencabutan itu
    # diam-diam melumpuhkan lapis keempat pipeline navigasi.
    #
    # Alasan pencabutannya benar PADA MASANYA: bentuk inputnya NCHW
    # [1,3,640,640] sementara YoloNavigasiService menyusun NHWC
    # [1,640,640,3], jadi interpreter menolaknya dan deteksi rintangan
    # mengembalikan daftar kosong tiap frame tanpa satu pun tanda.
    #
    # Tapi model ini sekarang dimuat YoloNavInt8Service, bukan
    # YoloNavigasiService. Service itu dibangun KHUSUS untuk tata letak NCHW:
    # ia mentranspose NHWC ke NCHW sendiri sebelum inferensi, dan bahkan
    # menolak memuat model yang bentuknya BUKAN NCHW.
    #
    # Selama berkasnya tidak ada di daftar ini, `rootBundle.load` gagal,
    # `_int8Ready` tetap false, dan `NavigationProvider` diam-diam memakai
    # `Future.value(const <Detection>[])` sebagai gantinya. Pipeline yang
    # dikira berjalan empat lapis sebenarnya cuma tiga - tanpa galat, tanpa
    # log, tanpa perbedaan yang terlihat di layar. Biayanya 2,9 MB.
    - assets/icons/

  # ── Font DIBUNDEL, tidak diunduh saat runtime ───────────────────────────
  #
  # Sebelumnya tipografi memakai paket `google_fonts`, yang mengambil berkas
  # IBM Plex dari fonts.gstatic.com pada pemakaian pertama. Tiga akibatnya
  # tidak bisa diterima aplikasi ini:
  #
  # 1. KELUAR SEBAGAI UNHANDLED EXCEPTION. Saat jaringan mati atau diblokir,
  #    `google_fonts` melempar dan tidak ada yang menangkapnya - terlihat di
  #    log perangkat sebagai `dart_vm_initializer.cc(40) Unhandled Exception`
  #    tepat di layar pertama.
  # 2. BERTENTANGAN DENGAN SIFAT APLIKASI. Empat dari enam mode (Tuntun,
  #    Kenali Uang, OCR, Navigasi) sengaja berjalan penuh tanpa jaringan.
  #    Menyandera tampilannya pada unduhan font membatalkan jaminan itu.
  # 3. MENGIRIM PERMINTAAN KE GOOGLE SAAT MULAI. Untuk rilis Play itu harus
  #    diungkap di formulir Data safety, demi sesuatu yang tidak perlu ada.
  #
  # Berkasnya IBM Plex rilis resmi IBM, lisensi SIL OFL 1.1, teks lisensinya
  # ikut di assets/fonts/LICENSE-IBMPlex.txt. Total 660 KB - jauh lebih murah
  # daripada satu permintaan jaringan di jalur mulai aplikasi.
  #
  # Bobot yang didaftarkan HANYA yang dipakai kode (w400/500/600/700 untuk
  # Sans, w400/500 untuk Mono). Menambah bobot lain menambah berat APK untuk
  # sesuatu yang tidak pernah dirender.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.otf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.otf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.otf
          weight: 500
