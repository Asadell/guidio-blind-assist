name: guidio_app
description: Guidio - AI Navigation Assistant untuk Tunanetra
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Kamera
  camera: ^0.11.0+2

  # TFLite on-device inference
  tflite_flutter: ^0.12.1

  # Text-to-Speech (Bahasa Indonesia)
  flutter_tts: ^4.0.2

  # Speech-to-Text (Voice Assistant)
  speech_to_text: ^7.0.0

  # WebSocket ke server
  web_socket_channel: ^3.0.1

  # HTTP untuk REST (OCR, single-shot detect, narasi)
  http: ^1.2.1

  # Sensor accelerometer (camera health check posisi)
  sensors_plus: ^7.0.0

  # Kondisi global - offline, baterai kritis (StatusBanner gabungan)
  connectivity_plus: ^6.0.5
  battery_plus: ^6.0.2

  # Izin kamera, mikrofon
  permission_handler: ^11.3.1

  # Haptic feedback (getar saat mic aktif)
  vibration: ^2.0.0

  # Local storage untuk lokasi favorit (tanpa login)
  shared_preferences: ^2.3.2

  # Konversi YUV420 → JPEG untuk server stream
  image: ^4.1.7

  # Icon
  cupertino_icons: ^1.0.8

  # Font - IBM Plex Sans / IBM Plex Mono (design system Vinara)
  google_fonts: ^6.2.1
  google_mlkit_text_recognition: ^0.16.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  # Dipakai test/money_pipeline_test.dart untuk merakit CameraImage YUV420
  # palsu. `package:camera` mengekspor ImageFormatGroup tapi TIDAK mengekspor
  # CameraImageData/CameraImagePlane/CameraImageFormat, jadi paket ini harus
  # dirujuk langsung. Sudah ikut sebagai dependensi transitif camera; baris ini
  # membuatnya eksplisit supaya lint depend_on_referenced_packages tenang.
  camera_platform_interface: ^2.13.0
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/vinara_logo.png"
  min_sdk_android: 26
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    # Daftar model DISEBUT SATU PER SATU, bukan seluruh direktori.
    #
    # `- assets/models/` ikut membundel semua yang kebetulan ada di folder itu,
    # termasuk yolo11l_float32.tflite (96,9 MB), yoloe_find.onnx (11 MB),
    # pidnet_s.onnx.data (2,5 MB) dan pidnet_s_3zona.onnx - tidak satu pun
    # dimuat kode, semuanya ikut ke APK. Untuk pengguna dengan kuota terbatas
    # itu ratusan megabyte yang dibayar tanpa satu pun manfaat.
    #
    # Menambah berkas ke assets/models/ TIDAK otomatis membundelnya. Itu
    # disengaja: tambahkan barisnya di sini hanya kalau kode benar-benar
    # memuatnya lewat rootBundle.
    - assets/models/ssd_mobilenet.tflite        # TFLiteService - deteksi rintangan
    - assets/models/labelmap.txt                # TFLiteService - label COCO
    - assets/models/rupiah_classifier_fp16.tflite  # MoneyTFLiteService - 7 pecahan
    #
    # uang_rupiah.tflite dan rupiah_classifier_int8.tflite (dua model lama)
    # sengaja TIDAK dibundel lagi: sudah digantikan
    # rupiah_classifier_fp16.tflite. Berkasnya tetap ada di assets/models/
    # sebagai arsip, tapi tidak ikut ke APK.
    #
    # rupiah_labels.txt juga tidak dibundel - urutan kelasnya sudah tetap di
    # MoneyTFLiteService.classValues, jadi tidak ada yang memuatnya lewat
    # rootBundle. Berkasnya disimpan sebagai rujukan saat mengganti model.
    - assets/models/pidnet_s_3zona.tflite       # PidnetService - segmentasi jalur
    #
    # pidnet_s_3zona_fp16.tflite TIDAK dibundel. Tensor masukannya bertipe
    # FLOAT16 sementara seluruh pipeline menghasilkan FLOAT32, jadi dia tidak
    # akan pernah bisa dipakai - delegate apa pun. Dulu dia dicoba lebih dulu
    # dan hanya dilewati kalau berkasnya hilang, sehingga segmentasi jalur
    # gagal di setiap frame tanpa satu pun tanda di layar.
    #
    # `PidnetService.tryLoad` sekarang membuktikan tiap varian dengan
    # inferensi percobaan, jadi menambahkannya kembali pun aman - tapi
    # 1,3 MB di APK untuk berkas yang pasti ditolak tetap sia-sia.
    - assets/models/yolo11n_navigasi.tflite     # YoloNavigasiService - rintangan navigasi, 6 kelas
    #
    # yolo11n.tflite (model lama) TIDAK dibundel lagi. Selain sudah digantikan,
    # bentuk inputnya NCHW [1,3,640,640] sementara YoloNavigasiService menyusun
    # NHWC [1,640,640,3] - interpreter menolaknya dan deteksi rintangan
    # mengembalikan daftar kosong pada setiap frame tanpa tanda apa pun.
    - assets/icons/
